name: Test security lab code

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run boundary demo tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Build threaded MD5 search
        run: cc -std=c11 -O3 -pthread vortex5/md5Search.c -o /tmp/md5-search

      - name: Check threaded MD5 search
        run: test "$(/tmp/md5-search 594f803b380a41396ed63dca39503542 2)" = 'aaaaa'
